<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kevin Mackay</title>
  <meta name="description" content="Kevin Mackay, Senior Software Engineer at BBC Research & Development.">
  <meta name="theme-color" content="#070b17">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Pick language before first paint: ?lang= > saved choice > browser preference.
    (function () {
      var lang = new URLSearchParams(location.search).get('lang');
      try { lang = lang || localStorage.getItem('lang'); } catch (e) {}
      if (!lang) lang = (navigator.languages || [navigator.language]).some(function (l) { return /^ja/i.test(l); }) ? 'ja' : 'en';
      if (lang !== 'ja') lang = 'en';
      document.documentElement.lang = lang;
      document.documentElement.dataset.lang = lang;
    })();
  </script>
</head>
<body>
  <canvas id="embers" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="./">Kevin Mackay</a>
    <div class="lang-toggle" role="group" aria-label="Language / 言語">
      <button type="button" data-set-lang="en" lang="en">English</button>
      <button type="button" data-set-lang="ja" lang="ja">日本語</button>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1 lang="en">Senior Software Engineer at BBC Research &amp; Development.</h1>
      <h1 lang="ja"><span class="nowrap">BBC R&amp;D（研究開発部門）の</span>シニアソフトウェア<wbr>エンジニア。</h1>
      <p lang="en">I lead engineering on experiences and web tools for live media, and design the infrastructure behind them.</p>
      <p lang="ja">ライブメディアのための体験やウェブツールの開発をリードし、それを支えるインフラを設計しています。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="campfire">
      <svg class="bonfire" viewBox="0 0 32 32" aria-hidden="true">
        <g stroke-linecap="round" stroke-width="3.2">
          <path d="M7 23.5 25 28.5" stroke="#7d4526"/>
          <path d="M7 28.5 25 23.5" stroke="#9a5a32"/>
        </g>
        <g class="flame">
          <path fill="#d24619" d="M16 3c1.5 4.5 7.5 7.5 7.5 14.5 0 4.5-3.5 7.5-7.5 7.5s-7.5-3-7.5-7.5c0-4 2.5-6 3.5-9 1 2 1.5 3 2.5 3.5 0-3.5.5-6.5 1.5-9z"/>
          <path fill="#ff8a3d" d="M16 9c1 3 5 5 5 9.5 0 3.5-2.2 5.5-5 5.5s-5-2-5-5.5c0-2.5 1.5-4 2.5-5.5.5 1.5 1 2 1.5 2.5 0-2.5.4-4.5 1-6.5z"/>
          <path class="flame core" fill="#ffd27a" d="M16 15c1 2 3 3.5 3 5.5s-1.3 3.5-3 3.5-3-1.5-3-3.5c0-1.5 1-2.5 1.8-3.5.4-.5.9-1.2 1.2-2z"/>
        </g>
      </svg>
      <p class="bonfire-lit">Bonfire lit</p>
    </div>
    <p class="links">
      <a href="https://github.com/yakca">GitHub</a>
      <a href="https://www.linkedin.com/in/yakca">LinkedIn</a>
    </p>
  </footer>

  <script src="assets/main.js" defer></script>
</body>
</html>
